<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F3F3F1" />
    <title>Bedside</title>
    <meta
      name="description"
      content="Respiratory therapy study notes. Collapsible, editable, kept on this device."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Nunito:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
    />
    <script>
      try {
        var r = JSON.parse(
          localStorage.getItem("bedside-notes-v2") ||
            localStorage.getItem("bedside-notes-v1") ||
            "{}",
        );
        var t = r.state && r.state.theme;
        if (t === "dark") document.documentElement.classList.add("dark");
        if (t === "black") document.documentElement.classList.add("black");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
